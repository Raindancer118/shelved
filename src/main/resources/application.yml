spring:
  application:
    name: shelved
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SHELVED_DB_URL:jdbc:postgresql://localhost:5433/shelved}
    username: ${SHELVED_DB_USER:shelved}
    password: ${SHELVED_DB_PASSWORD:shelved}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  web:
    resources:
      cache:
        cachecontrol:
          # revalidate every time (cheap 304): after a deploy nobody keeps old JS/CSS
          no-cache: true
  session:
    jdbc:
      # tables come from Flyway (V5__spring_session.sql)
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: lax
        secure: ${SHELVED_SECURE_COOKIES:true}
        # a persistent cookie: Android kills the browser while the camera app is open, and a session-only
        # cookie would be gone when it comes back
        max-age: 30d
      timeout: 30d

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

shelved:
  data-dir: ${SHELVED_DATA_DIR:./data}
  auth-mode: ${SHELVED_AUTH_MODE:oidc}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${SHELVED_MODEL:claude-sonnet-5-5}
  scans-per-hour: ${SHELVED_SCANS_PER_HOUR:40}
  google-books-api-key: ${GOOGLE_BOOKS_API_KEY:}
  public-url: ${SHELVED_PUBLIC_URL:https://shelf.tstieh.de}
  bookshop:
    name: ${SHELVED_BOOKSHOP_NAME:Buchhandlung Cremer}
    url: ${SHELVED_BOOKSHOP_URL:https://buchhandlungcremer.buchkatalog.de/{isbn}}
  mail-from: ${SHELVED_MAIL_FROM:shelved <noreply@tstieh.de>}
