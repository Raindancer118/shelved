name: CI/CD

on:
  push:
    branches: ['**']
    tags: ['*.*.*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Tests (incl. startup tests against PostgreSQL via Testcontainers)
        run: mvn -B verify
      - name: Docker image builds
        run: docker build -t shelved:ci .

  deploy:
    name: Deploy
    needs: test
    # Runs once the self-hosted runner exists:
    #   gh variable set DEPLOY_ENABLED --body true --repo Raindancer118/shelved
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, shelved]
    steps:
      - uses: actions/checkout@v5

      # The server .env holds production secrets and is NEVER overwritten.
      - name: Sync sources
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.env' --exclude '*.env' --exclude '.env.*' \
            --exclude 'target' --exclude 'data' --exclude 'Project.md' \
            --exclude '.vault-project.enc' --exclude 'prototype' \
            ./ /home/murthag/shelved/

      - name: Production .env exists
        run: test -f /home/murthag/shelved/.env

      - name: Build and start containers
        working-directory: /home/murthag/shelved
        run: |
          docker compose build app
          docker compose up -d

      - name: Health-Check
        working-directory: /home/murthag/shelved
        run: |
          PORT=$(grep -E '^APP_PORT=' .env | cut -d= -f2); PORT=${PORT:-8151}
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${PORT}/actuator/health" | grep -q '"status":"UP"'; then
              echo "shelved is UP"; exit 0
            fi
            sleep 3
          done
          docker logs --tail 150 shelved-app
          exit 1

      - name: Trim build cache
        if: always()
        run: docker builder prune -f --filter until=48h || true
